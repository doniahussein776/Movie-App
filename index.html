<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Navbar -->
    <nav id="sideNav" class="d-flex">
        <div class="nav-content d-flex flex-column justify-content-between p-4">
            <div class="links">
                <a href="#" onclick="getMovies('now_playing')">Now Playing</a>
                <a href="#" onclick="getMovies('popular')">Popular</a>
                <a href="#" onclick="getMovies('top_rated')">Top Rated</a>
                <a href="#" onclick="getMovies('trending')">Trending</a>
                <a href="#" onclick="getMovies('upcoming')">Upcoming</a>
                <a href="#contact">Contact Us</a>
            </div>
            <div class="social-icons">
                <i class="fab fa-facebook"></i>
                <i class="fab fa-twitter"></i>
                <i class="fab fa-instagram"></i>
                <div class="mt-3 text-muted">Copyright &copy; 2023</div>
            </div>
        </div>
        <div class="nav-header d-flex flex-column justify-content-between align-items-center py-3 bg-white text-black">
            <img src="./imges/logo.png" alt="Logo" class="w-50"> 
            <i class="fa-solid fa-bars fa-2x open-close-icon" onclick="toggleMenu()"></i>
            <div class="icons">
                <i class="fa-solid fa-globe d-block mb-2"></i>
                <i class="fa-solid fa-share-nodes"></i>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5" id="main-content">
        <!-- Search Inputs -->
        <div class="row py-4" id="search-container">
            <div class="col-md-6 mb-3">
                <input type="text" class="form-control bg-transparent text-white" id="searchByWord" placeholder="Search " onkeyup="searchByWord(this.value)">
            </div>
        </div>

        <!-- Movies Grid -->
        <div class="row g-4" id="rowData">
            <!-- Movies will be injected here by JS -->
        </div>
    </div>

    <!-- Contact Section -->

    <div class="main-content">
        <section class="contact-section">
            <h1>Contact US</h1>
            <form action="#" method="POST" class="contact-form">
                
                <div class="input-group">
                    <input type="text" placeholder="Enter Your Name" required>
                    <input type="email" placeholder="Enter Your Email" required>
                </div>
                
                <div class="input-group">
                    <input type="tel" placeholder="Enter Your Phone" required>
                    <input type="number" placeholder="Enter Your Age" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Enter Your Password" required>
                    <input type="password" placeholder="ReEnter Password" required>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>

    </div>


    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
